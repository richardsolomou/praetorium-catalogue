name: Catalogue history seed

on:
  workflow_dispatch:

concurrency:
  group: catalogue-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      CATALOGUE_AUTHORING_DIR: ${{ github.workspace }}
      CATALOGUE_BASE_URL: https://s3.praetorium.gg/catalogue
      AWS_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      SNAPSHOT_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v7
      - name: Read the compiler pin
        id: compiler
        run: |
          node scripts/check.mjs
          echo "repository=$(jq -r .repository compiler.json)" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -r .revision compiler.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.compiler.outputs.repository }}
          ref: ${{ steps.compiler.outputs.revision }}
          path: compiler
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: compiler/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: compiler/package.json
          cache: pnpm
          cache-dependency-path: compiler/pnpm-lock.yaml
      - name: Build the verified history seed
        working-directory: compiler
        run: |
          pnpm install --frozen-lockfile
          pnpm catalogue:history-seed --out /tmp/catalogue-history-seed.json
      - name: Publish and verify the seed
        run: |
          aws s3 cp /tmp/catalogue-history-seed.json s3://praetorium/catalogue/changes/seed.json --endpoint-url "$SNAPSHOT_ENDPOINT" --content-type application/json --cache-control no-store --only-show-errors
          aws s3 cp s3://praetorium/catalogue/changes/seed.json /tmp/published-seed.json --endpoint-url "$SNAPSHOT_ENDPOINT" --only-show-errors
          cmp /tmp/catalogue-history-seed.json /tmp/published-seed.json
